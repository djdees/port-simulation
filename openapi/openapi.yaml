openapi: 3.1.0
info:
  title: New Orleans Port Information Service
  version: 1.0.0
  description: |
    Read-only HTTP API for a fictionalized commercial port based in the New Orleans,
    Louisiana area. All vessels, cargo, facilities, and events in this dataset are
    entirely fictional and are provided for engineering demonstration purposes only.
    This service has no affiliation with or endorsement by the Port of New Orleans
    or any actual port operator.

    **Security:** Protected endpoints require mutual TLS authenticated with SPIFFE
    X.509-SVIDs issued by an operational SPIRE deployment. The `mutualTLS` security
    scheme below documents the contract — TLS validation and SPIFFE identity
    authorization are enforced by the server runtime, not by this OpenAPI document.

servers:
  - url: https://localhost:8443
    description: Local development (SPIFFE-off mode uses http://localhost:8080)

components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: |
        Client must present a valid SPIFFE X.509-SVID. The server validates the
        client certificate against the SPIRE trust bundle and checks the client's
        SPIFFE ID against the authorization policy (port:read permission required).
        Identity in HTTP headers or query parameters is never trusted.

  schemas:
    Vessel:
      type: object
      required: [id, name, imo, mmsi, call_sign, flag_country, kind, owner, length_m, draft_m]
      properties:
        id:        { type: string, example: "VSL-001" }
        name:      { type: string, example: "MV Delta Star" }
        imo:       { type: string, example: "IMO9876543" }
        mmsi:      { type: string, example: "338901234" }
        call_sign: { type: string, example: "WDST" }
        flag_country: { type: string, example: "US" }
        kind:
          type: string
          enum: [freighter, tanker, osv, towboat, bulker]
        owner:     { type: string, example: "Gulf Coast Shipping LLC" }
        length_m:  { type: number, format: double, example: 185.0 }
        draft_m:   { type: number, format: double, example: 9.5 }

    Barge:
      type: object
      required: [id, name, owner, capacity_mt, capability, length_m]
      properties:
        id:          { type: string, example: "BGE-001" }
        name:        { type: string, example: "RFS-101" }
        owner:       { type: string, example: "River Freight Services Inc." }
        capacity_mt: { type: number, format: double, example: 1500.0 }
        capability:
          type: string
          enum: [dry_bulk, liquid_bulk, hopper, covered, open]
        length_m: { type: number, format: double, example: 61.0 }

    Tow:
      type: object
      required: [id, name, towboat_id, barge_ids]
      properties:
        id:         { type: string, example: "TOW-001" }
        name:       { type: string, example: "MQ Downriver Run 1" }
        towboat_id: { type: string, example: "VSL-005" }
        barge_ids:
          type: array
          items: { type: string }
          example: ["BGE-001", "BGE-002"]

    Cargo:
      type: object
      required: [id, commodity, origin, destination, weight_mt]
      properties:
        id:          { type: string, example: "CGO-001" }
        commodity:
          type: string
          enum: [grain, soybeans, steel, petroleum, lng, chemicals, containers, coal, fertilizer, timber]
        origin:      { type: string, example: "St. Louis, MO" }
        destination: { type: string, example: "Rotterdam, Netherlands" }
        vessel_id:   { type: string, example: "VSL-001" }
        barge_id:    { type: string, example: "BGE-001" }
        weight_mt:   { type: number, format: double, example: 12500.0 }
        notes:       { type: string }

    Facility:
      type: object
      required: [id, name, kind]
      properties:
        id:   { type: string, example: "FAC-001" }
        name: { type: string, example: "Crescent Commercial Terminal" }
        kind:
          type: string
          enum: [commercial, industrial, service, anchorage]

    Terminal:
      type: object
      required: [id, name, facility_id]
      properties:
        id:          { type: string, example: "TRM-001" }
        name:        { type: string, example: "CCT North Grain Terminal" }
        facility_id: { type: string, example: "FAC-001" }

    Berth:
      type: object
      required: [id, name, terminal_id, max_draft_m, max_length_m]
      properties:
        id:           { type: string, example: "BTH-001" }
        name:         { type: string, example: "CCT-N Berth 1" }
        terminal_id:  { type: string, example: "TRM-001" }
        max_draft_m:  { type: number, format: double, example: 11.0 }
        max_length_m: { type: number, format: double, example: 220.0 }

    TrafficEvent:
      type: object
      required: [id, event_type, occurred_at]
      properties:
        id:         { type: string, example: "EVT-001" }
        event_type:
          type: string
          enum: [arrival, departure, berth_assignment, load_start, load_complete,
                 unload_start, unload_complete, service, delay, anchor]
        vessel_id:   { type: string, example: "VSL-001" }
        barge_id:    { type: string, example: "BGE-001" }
        tow_id:      { type: string, example: "TOW-001" }
        facility_id: { type: string, example: "FAC-001" }
        berth_id:    { type: string, example: "BTH-001" }
        cargo_ids:
          type: array
          items: { type: string }
        occurred_at: { type: string, format: date-time, example: "2026-10-20T06:15:00Z" }
        notes:       { type: string }

    ProblemDetail:
      type: object
      description: RFC 9457 problem detail response
      properties:
        type:   { type: string, example: "about:blank" }
        title:  { type: string, example: "Not Found" }
        status: { type: integer, example: 404 }
        detail: { type: string, example: "vessel not found" }

    VesselCollection:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:  { type: array, items: { $ref: '#/components/schemas/Vessel' } }
        total:  { type: integer, example: 6 }
        limit:  { type: integer, example: 20 }
        offset: { type: integer, example: 0 }

    BargeCollection:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:  { type: array, items: { $ref: '#/components/schemas/Barge' } }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    TowCollection:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:  { type: array, items: { $ref: '#/components/schemas/Tow' } }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    CargoCollection:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:  { type: array, items: { $ref: '#/components/schemas/Cargo' } }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    FacilityCollection:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:  { type: array, items: { $ref: '#/components/schemas/Facility' } }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    TerminalCollection:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:  { type: array, items: { $ref: '#/components/schemas/Terminal' } }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    BerthCollection:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:  { type: array, items: { $ref: '#/components/schemas/Berth' } }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    EventCollection:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:  { type: array, items: { $ref: '#/components/schemas/TrafficEvent' } }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

  parameters:
    limit:
      name: limit
      in: query
      description: Maximum number of items to return (1–100, default 20)
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    offset:
      name: offset
      in: query
      description: Number of items to skip (default 0)
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    BadRequest:
      description: Invalid query parameter
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Client identity required (mTLS)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Client SPIFFE ID not authorized
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

security:
  - mutualTLS: []

paths:
  /api/v1/health/live:
    get:
      summary: Liveness check
      description: Returns 200 if the server process is running. No authentication required.
      security: []
      operationId: getLive
      tags: [Health]
      responses:
        '200':
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }

  /api/v1/health/ready:
    get:
      summary: Readiness check
      description: Returns 200 if the data store is loaded and ready. No authentication required.
      security: []
      operationId: getReady
      tags: [Health]
      responses:
        '200':
          description: Server is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ready" }
        '503':
          description: Server not ready

  /api/v1/vessels:
    get:
      summary: List vessels
      operationId: listVessels
      tags: [Vessels]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: kind
          in: query
          schema: { type: string, enum: [freighter, tanker, osv, towboat, bulker] }
        - name: flag_country
          in: query
          description: ISO 3166-1 alpha-2 country code
          schema: { type: string, example: "US" }
      responses:
        '200':
          description: List of vessels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VesselCollection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/vessels/{id}:
    get:
      summary: Get vessel by ID
      operationId: getVessel
      tags: [Vessels]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: "VSL-001" }
      responses:
        '200':
          description: Vessel details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vessel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/arrivals:
    get:
      summary: List arrival events
      operationId: listArrivals
      tags: [Events]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: facility_id
          in: query
          schema: { type: string, example: "FAC-001" }
        - name: since
          in: query
          description: Filter events at or after this time (RFC3339)
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: Filter events at or before this time (RFC3339)
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: List of arrival events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCollection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/departures:
    get:
      summary: List departure events
      operationId: listDepartures
      tags: [Events]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: facility_id
          in: query
          schema: { type: string, example: "FAC-001" }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: List of departure events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCollection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/barges:
    get:
      summary: List barges
      operationId: listBarges
      tags: [Barges]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: capability
          in: query
          schema: { type: string, enum: [dry_bulk, liquid_bulk, hopper, covered, open] }
        - name: tow_id
          in: query
          schema: { type: string, example: "TOW-001" }
      responses:
        '200':
          description: List of barges
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BargeCollection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/barges/{id}:
    get:
      summary: Get barge by ID
      operationId: getBarge
      tags: [Barges]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: "BGE-001" }
      responses:
        '200':
          description: Barge details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Barge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/tows:
    get:
      summary: List tows
      operationId: listTows
      tags: [Tows]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: towboat_id
          in: query
          schema: { type: string, example: "VSL-005" }
        - name: barge_id
          in: query
          schema: { type: string, example: "BGE-001" }
      responses:
        '200':
          description: List of tows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TowCollection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/tows/{id}:
    get:
      summary: Get tow by ID
      operationId: getTow
      tags: [Tows]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: "TOW-001" }
      responses:
        '200':
          description: Tow details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/cargo:
    get:
      summary: List cargo records
      operationId: listCargo
      tags: [Cargo]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: commodity
          in: query
          schema:
            type: string
            enum: [grain, soybeans, steel, petroleum, lng, chemicals, containers, coal, fertilizer, timber]
        - name: origin
          in: query
          schema: { type: string }
        - name: destination
          in: query
          schema: { type: string }
        - name: vessel_id
          in: query
          schema: { type: string }
        - name: barge_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: List of cargo records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CargoCollection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/cargo/{id}:
    get:
      summary: Get cargo record by ID
      operationId: getCargo
      tags: [Cargo]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: "CGO-001" }
      responses:
        '200':
          description: Cargo record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cargo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/facilities:
    get:
      summary: List facilities
      operationId: listFacilities
      tags: [Facilities]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: kind
          in: query
          schema: { type: string, enum: [commercial, industrial, service, anchorage] }
      responses:
        '200':
          description: List of facilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacilityCollection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/facilities/{id}:
    get:
      summary: Get facility by ID
      operationId: getFacility
      tags: [Facilities]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: "FAC-001" }
      responses:
        '200':
          description: Facility details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Facility' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/terminals:
    get:
      summary: List terminals
      operationId: listTerminals
      tags: [Terminals]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: facility_id
          in: query
          schema: { type: string, example: "FAC-001" }
      responses:
        '200':
          description: List of terminals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TerminalCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/terminals/{id}:
    get:
      summary: Get terminal by ID
      operationId: getTerminal
      tags: [Terminals]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: "TRM-001" }
      responses:
        '200':
          description: Terminal details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Terminal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/berths:
    get:
      summary: List berths
      operationId: listBerths
      tags: [Berths]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: terminal_id
          in: query
          schema: { type: string, example: "TRM-001" }
      responses:
        '200':
          description: List of berths
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BerthCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/berths/{id}:
    get:
      summary: Get berth by ID
      operationId: getBerth
      tags: [Berths]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: "BTH-001" }
      responses:
        '200':
          description: Berth details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Berth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
